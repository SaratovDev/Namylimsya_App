services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: namylimsya_pg
    environment:
      POSTGRES_USER: namylimsya
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: namylimsya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namylimsya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: namylimsya_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: namylimsya_mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata: